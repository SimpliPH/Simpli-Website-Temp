<!doctype html>
<html lang="en" data-theme="light" data-page="contact">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />

    <title>Contact — Simpli Studio</title>
    <meta name="description" content="Contact — Simpli Studio" />
    <link rel="icon" type="image/png" href="assets/Logo-2.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header class="site-header" role="banner">
      <nav class="nav" aria-label="Primary">
        <a class="brand" href="index.html" aria-label="Simpli Studio home">
          <img
            class="brand__logo"
            id="siteLogo"
            src="assets/Logo-1.png"
            alt="Simpli Studio logo"
            width="64"
            height="64"
            decoding="async"
          />
          <span class="brand__wordmark">Simpli Studio</span>
        </a>

        <div class="nav__desktop">
          <button
            class="theme-toggle"
            id="themeToggle"
            type="button"
            aria-label="Toggle theme"
            aria-pressed="false"
            title="Toggle theme"
          >
            <span class="theme-dot" aria-hidden="true"></span>
          </button>

          <button
            class="hamburger"
            id="menuToggle"
            type="button"
            aria-label="Open menu"
            aria-expanded="false"
            aria-controls="mobileMenu"
          >
            <span></span>
            <span></span>
            <span></span>
          </button>
        </div>
      </nav>

      <div class="mobile-menu" id="mobileMenu" hidden>
        <div class="mobile-menu__inner">
          <a class="mobile-menu__link gated-link" href="work.html">Work</a>
          <a class="mobile-menu__link gated-link" href="services.html">Services</a>
          <a class="mobile-menu__link gated-link" href="about.html">About</a>
          <a class="mobile-menu__link gated-link" href="contact.html">Contact</a>
          <a class="mobile-menu__link" href="index.html">Home</a>
        </div>
      </div>
    </header>

    <main class="page">
      <section class="section contact contact--page">
        <div class="container layout-panel">
          <header class="contact__header reveal">
            <p class="kicker">Contact</p>

            <h1 class="contact__title">
              <a
                class="contact__link"
                href="mailto:simpligroup.official@proton.me?subject=Project%20Inquiry%20—%20Simpli%20Studio&body=Hi%20Simpli%20Studio%2C%0A%0AI'd%20love%20to%20talk%20about%20a%20project.%0A%0A-%20Name%3A%0A-%20Brand%2FCompany%3A%0A-%20Timeline%3A%0A-%20Budget%3A%0A%0AThanks!"
              >
                Let’s work together.
              </a>
            </h1>

            <p class="contact__subtitle">
              Email:
              <a class="inline-link" href="mailto:simpligroup.official@proton.me">simpligroup.official@proton.me</a>
            </p>

            <div class="section__cta reveal">
              <a class="btn btn--ghost" href="index.html">Back home</a>
            </div>
          </header>
        </div>
      </section>
    </main>

    <footer class="footer" role="contentinfo">
      <div class="container footer__inner">
        <a class="footer__link" href="mailto:simpligroup.official@proton.me">simpligroup.official@proton.me</a>
        <span class="footer__sep">•</span>
        <span class="footer__text">Davao, Philippines</span>
        <span class="footer__sep">•</span>
        <span class="footer__text">EST. 2026 | Simpli Studio</span>
      </div>
    </footer>

    <script src="script.js" defer></script>
  </body>
</html>
